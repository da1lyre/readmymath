<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WriteYourMath</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 0; background: #fff; font-family: sans-serif; height: 100%; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; padding: 10px; text-align: center; background: #f0f0f0; border-radius: 8px; cursor: pointer; font-weight: bold; color: #555; transition: 0.2s; }
  .tab.active { background: #1A1A1A; color: #fff; }

  #charPicker { display: none; margin-bottom: 12px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
  .char-btn { display: inline-block; padding: 8px 16px; margin-right: 8px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 20px; font-family: serif; }
  .char-btn.active { border-color: #1A1A1A; background: #eee; font-weight: bold; }

  /* Контейнер для холста - теперь КВАДРАТНЫЙ и по центру */
  #canvasWrap {
    flex: 1;
    position: relative;
    border: 1.5px solid #E5E5E5;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    margin: 0 auto;
    width: 100%;
    max-width: 100%;
  }

  /* Эталон */
  #templateImg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0.15;
    pointer-events: none;
    display: none;
    z-index: 1;
  }

  /* Холст для рисования */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    background: transparent;
  }

  #toolbar { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 12px; font-size: 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
  #clearBtn { background: #F2F2F2; color: #1A1A1A; }
  #sendBtn { background: #1A1A1A; color: #fff; }
  #result { margin-top: 10px; font-size: 16px; text-align: center; font-weight: bold; color: #1A1A1A; }
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <div class="tab active" id="tabFormula">Formula</div>
    <div class="tab" id="tabTrain">Practice</div>
  </div>

  <div id="charPicker"></div>

  <div id="canvasWrap">
    <img id="templateImg" src="" alt="template">
    <canvas id="canvas"></canvas>
  </div>

  <div id="toolbar">
    <button id="clearBtn">Clear</button>
    <button id="sendBtn">Check</button>
  </div>
  <div id="result"></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const templateImg = document.getElementById('templateImg');
  const charPicker = document.getElementById('charPicker');
  const result = document.getElementById('result');

  let mode = 'formula';
  let currentCharCode = null;
  let currentChar = null;
  let drawing = false;

  const charsToTrain = "0123456789abcdefghijklmnopqrstuvwxyzαβγδεζηθικλμνξοπρστυφχψω".split("");

  charsToTrain.forEach(char => {
    const btn = document.createElement('button');
    btn.className = 'char-btn';
    btn.textContent = char;
    btn.onclick = () => {
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentChar = char;
      currentCharCode = char.codePointAt(0).toString(16).padStart(4, '0');
      updateTemplate();
      clearCanvas();
    };
    charPicker.appendChild(btn);
  });

  document.getElementById('tabFormula').onclick = () => setMode('formula');
  document.getElementById('tabTrain').onclick = () => setMode('train');

  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(mode === 'formula' ? 'tabFormula' : 'tabTrain').classList.add('active');

    if (mode === 'train') {
      charPicker.style.display = 'block';
      templateImg.style.display = 'block';
      if (!currentChar) document.querySelector('.char-btn').click();
    } else {
      charPicker.style.display = 'none';
      templateImg.style.display = 'none';
    }
    clearCanvas();
    resize();
  }

  function updateTemplate() {
    if (currentCharCode) {
      templateImg.src = `/static/templates/u${currentCharCode}.png`;
    }
  }

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineWidth = mode === 'train' ? 12 : 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1A1A1A';
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    result.textContent = '';
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  function start(e) { e.preventDefault(); drawing = true; const {x,y} = getPos(e); ctx.beginPath(); ctx.moveTo(x, y); }
  function move(e) { if (!drawing) return; e.preventDefault(); const {x,y} = getPos(e); ctx.lineTo(x, y); ctx.stroke(); }
  function end(e) { if (drawing) { drawing = false; ctx.closePath(); } }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  document.getElementById('clearBtn').onclick = clearCanvas;
  document.getElementById('sendBtn').onclick = async () => {
    result.textContent = 'Checking...';
    const dataUrl = canvas.toDataURL('image/png');
    const blob = await (await fetch(dataUrl)).blob();
    const form = new FormData();
    form.append('file', blob, 'draw.png');

    try {
      let url = '/recognize';
      if (mode === 'train') {
        if (!currentCharCode) return;
        url = `/compare?char_code=${currentCharCode}`;
      }

      const resp = await fetch(url, { method: 'POST', body: form });
      const json = await resp.json();

      if (mode === 'formula') {
        result.innerHTML = `Recognized: <code>${json.latex || '...'}</code>`;
      } else {
        result.innerHTML = `Accuracy: ${json.score}%<br>${json.feedback}`;
      }
    } catch (err) {
      result.textContent = 'Error: ' + err.message;
    }
  };

  window.addEventListener('resize', resize);
  resize();
  setMode('formula');
</script>
</body>
</html>
