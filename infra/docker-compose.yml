services:
  crispembed:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: >
      /opt/crispembed/build/crispembed-server
      --ocr /cache/posformer-hw-f32.gguf
      --host 0.0.0.0
      --port 8080
    volumes:
      - ../models:/cache
      - ../shared:/shared
    environment:
      - CRISPEMBED_CACHE_DIR=/cache
    expose:
      - "8080"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/cache
      - ../shared:/shared
    environment:
      - CRISPEMBED_CACHE_DIR=/cache
      - CRISPEMBED_SERVER_URL=http://crispembed:8080
    depends_on:
      - crispembed

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "api:8000"
    ports:
      - "${NGROK_PORT:-4040}:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - api

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [ "python", "src/bot.py" ]
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
    depends_on:
      - api
    restart: unless-stopped